name: Deploy to DigitalOcean Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CLUSTER_NAME: repox-cluster
  FRONTEND_IMAGE: repox-frontend
  BACKEND_IMAGE: repox-backend
  REGISTRY: YOUR_DOCKERHUB_USERNAME

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy to DOKS
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and push Docker images
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Setup DigitalOcean CLI
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Save DigitalOcean kubeconfig
      run: |
        doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

    - name: Verify kubectl connection
      run: |
        kubectl cluster-info
        kubectl get nodes

    # Update Docker Hub secret (for pulling images)
    - name: Update Docker Hub secret
      run: |
        kubectl create secret docker-registry dockerhub-secret \
          --docker-server=docker.io \
          --docker-username=${{ secrets.DOCKER_USERNAME }} \
          --docker-password=${{ secrets.DOCKER_PASSWORD }} \
          --namespace=repox \
          --dry-run=client -o yaml | kubectl apply -f -

    # Deploy to DigitalOcean Kubernetes
    - name: Deploy to cluster
      run: |
        # Apply deployments and services
        kubectl apply -f kubernetes/core/backend-deployment.yaml
        kubectl apply -f kubernetes/core/backend-service.yaml
        kubectl apply -f kubernetes/core/frontend-deployment.yaml
        kubectl apply -f kubernetes/core/frontend-service.yaml
        
        # Update deployments with new image tags
        kubectl set image deployment/repox-backend \
          backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          -n repox

        kubectl set image deployment/repox-frontend \
          frontend=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
          -n repox

        # Apply HPA and Ingress
        kubectl apply -f kubernetes/monitoring/backend-hpa.yaml
        kubectl apply -f kubernetes/monitoring/frontend-hpa.yaml
        kubectl apply -f kubernetes/core/repox-ingress.yaml

    # Wait for deployments to be ready
    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/repox-backend -n repox --timeout=600s
        kubectl rollout status deployment/repox-frontend -n repox --timeout=600s

    # Verify deployment
    - name: Verify deployment
      run: |
        echo "Deployment Status: ✅ "
        kubectl get pods -n repox
        kubectl get svc -n repox
        kubectl get ingress -n repox
        echo ""
        echo " Deployment Complete! 🚀"
