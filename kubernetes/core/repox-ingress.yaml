apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: repox-ingress
  namespace: repox
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Enable HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    # Using nip.io for testing (no domain needed) - replace with your own droplet IP
    - repox.YOUR_DROPLET_IP.nip.io
    secretName: repox-tls
  rules:
  # Using nip.io for testing (no domain needed) - replace with your own droplet IP
  - host: repox.YOUR_DROPLET_IP.nip.io
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: repox-backend-service
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: repox-frontend-service
            port:
              number: 80
